# Jobs de GitLab CI para el micro lab 04-genai-docs-workflows. Plantillas en lab11_terraform_gcp/.gitlab-ci.yml
# Variable requerida en GitLab: GCP04_TFVARS (tipo File) con el contenido de terraform.tfvars

.gcp04_vars:
  variables:
    LAB_NAME: "04-genai-docs-workflows"
    LAB_DIR: "lab11_terraform_gcp/microlabs/04-genai-docs-workflows"
    TFVARS_FILE: $GCP04_TFVARS

.gcp04_changes: &gcp04_changes
  - lab11_terraform_gcp/microlabs/04-genai-docs-workflows/**/*
  - lab11_terraform_gcp/modules/**/*
  - lab11_terraform_gcp/.gitlab-ci.yml

gcp04:validate:
  extends: [.tf_validate, .gcp04_vars]
  rules:
    - changes: *gcp04_changes

gcp04:lint:
  extends: [.tf_lint, .gcp04_vars]
  rules:
    - changes: *gcp04_changes

gcp04:checkov:
  extends: [.tf_checkov, .gcp04_vars]
  rules:
    - changes: *gcp04_changes

gcp04:plan:
  extends: [.tf_plan, .gcp04_vars]
  needs: ["gcp04:validate"]
  rules:
    - changes: *gcp04_changes

gcp04:apply:
  extends: [.tf_apply, .gcp04_vars]
  needs: ["gcp04:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *gcp04_changes
      when: manual

gcp04:smoke:
  extends: [.tf_smoke, .gcp04_vars]
  needs: ["gcp04:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *gcp04_changes

gcp04:destroy:
  extends: [.tf_destroy, .gcp04_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "04-genai-docs-workflows"
      when: manual
