# Jobs de GitLab CI para el micro lab 05-genai-docs-stepfunctions. Plantillas en 03-cloud-e-infraestructura/lab10-terraform-aws/.gitlab-ci.yml
# Variable requerida en GitLab: LAB05_TFVARS (tipo File) con el contenido de terraform.tfvars

.lab05_vars:
  variables:
    LAB_NAME: "05-genai-docs-stepfunctions"
    LAB_DIR: "03-cloud-e-infraestructura/lab10-terraform-aws/microlabs/05-genai-docs-stepfunctions"
    TFVARS_FILE: $LAB05_TFVARS

.lab05_changes: &lab05_changes
  - 03-cloud-e-infraestructura/lab10-terraform-aws/microlabs/05-genai-docs-stepfunctions/**/*
  - 03-cloud-e-infraestructura/lab10-terraform-aws/modules/**/*
  - 03-cloud-e-infraestructura/lab10-terraform-aws/.gitlab-ci.yml

lab05:validate:
  extends: [.tf_validate, .lab05_vars]
  rules:
    - changes: *lab05_changes

lab05:lint:
  extends: [.tf_lint, .lab05_vars]
  rules:
    - changes: *lab05_changes

lab05:checkov:
  extends: [.tf_checkov, .lab05_vars]
  rules:
    - changes: *lab05_changes

lab05:plan:
  extends: [.tf_plan, .lab05_vars]
  needs: ["lab05:validate"]
  rules:
    - changes: *lab05_changes

lab05:apply:
  extends: [.tf_apply, .lab05_vars]
  needs: ["lab05:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab05_changes
      when: manual

lab05:smoke:
  extends: [.tf_smoke, .lab05_vars]
  needs: ["lab05:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab05_changes

lab05:destroy:
  extends: [.tf_destroy, .lab05_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "05-genai-docs-stepfunctions"
      when: manual
