# Service tipo NodePort: además de comportarse como un ClusterIP,
# abre un puerto fijo (30080, dentro del rango válido 30000-32767) en
# CADA nodo del clúster. Con clúster local (Docker Desktop) el "nodo"
# es la propia máquina, así que queda accesible en
# http://localhost:30080 sin necesidad de port-forward ni Ingress.
# Es la forma más simple de exponer algo hacia afuera en un clúster
# local; en un clúster real de nube normalmente se prefiere un Service
# tipo LoadBalancer o un Ingress en vez de NodePort.
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: lab5-k8s
  labels:
    app: nginx-lab
spec:
  type: NodePort
  selector:
    app: nginx-lab
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
