AWSTemplateFormatVersion: "2010-09-09"
Description: >
  MHP expense-report portal — edge stack: Application Load Balancer, ACM
  certificate, Route53 record, and WAF Web ACL. The ALB exists to give a
  single EC2 instance a real TLS certificate and a WAF in front of it,
  not to balance load across multiple targets — see
  infra/docs/adr/0004. Deploy after network.yaml and compute.yaml.

Parameters:
  ProjectName:
    Type: String
    Default: mhp-expenses
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Pass the VpcId output/export from network.yaml.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Pass the PublicSubnetIds output/export from network.yaml.
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Pass the AlbSecurityGroupId output/export from network.yaml.
  AppInstanceId:
    Type: AWS::EC2::Instance::Id
    Description: Pass the InstanceId output/export from compute.yaml.
  AppPort:
    Type: Number
    Default: 8000
    Description: Matches the Dockerfile's gunicorn bind port and compute.yaml's AppPort.
  HealthCheckPath:
    Type: String
    Default: /healthz
    Description: >
      Health endpoint the Django app must expose (not implemented yet —
      see infra/docs/adr/0004's consequences). Adjust if the app uses a
      different path.
  DomainName:
    Type: String
    Default: expenses.example-mhp.internal
    Description: >
      PLACEHOLDER — replace with your real domain before deploying.
      No real domain was provided when this template was written; this
      default will not resolve or issue a certificate successfully.
  HostedZoneId:
    Type: String
    Default: ""
    Description: >
      Route53 hosted zone ID for DomainName. Leave blank to skip creating
      the DNS record and rely on the ALB's own DNS name until you have a
      real hosted zone to point at.
  AlbLogsBucketName:
    Type: String
    Default: ""
    Description: >
      Optional S3 bucket name (already configured to accept ALB access
      logs) to enable ALB access logging. Leave blank to skip.

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  HasAlbLogsBucket: !Not [!Equals [!Ref AlbLogsBucketName, ""]]

Resources:
  # ---- ACM certificate (DNS validation) ----

  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-cert"

  # ---- Application Load Balancer ----
  # Single target group, single registered instance — this is not
  # load-balancing traffic, it's the mandatory attachment point for the
  # certificate and WAF below. infra/docs/adr/0004.

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-alb"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - !If
          - HasAlbLogsBucket
          - Key: access_logs.s3.enabled
            Value: "true"
          - !Ref AWS::NoValue
        - !If
          - HasAlbLogsBucket
          - Key: access_logs.s3.bucket
            Value: !Ref AlbLogsBucketName
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-alb"

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-app-tg"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref AppPort
      TargetType: instance
      Targets:
        - Id: !Ref AppInstanceId
          Port: !Ref AppPort
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref SiteCertificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # ---- Route53 record (only if a real hosted zone was provided) ----

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  # ---- WAF Web ACL (infra/docs/adr/0009) ----
  # AWS Managed Rule Groups, not hand-written rules, plus a per-IP rate
  # limit. Deployed against a real ALB, review sampled requests in COUNT
  # mode before flipping OverrideAction to none/BLOCK in production.

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-web-acl"
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ProjectName}-${Environment}-web-acl"
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-${Environment}-common-rule-set"
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-${Environment}-known-bad-inputs"
        - Name: RateLimitPerIp
          Priority: 2
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-${Environment}-rate-limit"

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref Alb
      WebACLArn: !GetAtt WebAcl.Arn

Outputs:
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  AlbHostedZoneId:
    Value: !GetAtt Alb.CanonicalHostedZoneID
  SiteCertificateArn:
    Value: !Ref SiteCertificate
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
