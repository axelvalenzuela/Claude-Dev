# CI del lab 8 (micro labs de IA). Corre en cada push/PR que toque 04-ia-generativa/lab08-curso-ia/.
#
# Todo corre en MODO=simulado: sin credenciales de GCP, sin red hacia Vertex AI,
# sin costo. Así cada cambio de prompt, modelo o código se prueba automáticamente.
#   1. lint        -> ruff (estilo y errores comunes)
#   2. tests       -> pytest de parte2_gcp (guardrails, validación, flujos, API)
#   3. evaluación  -> quality gate del lab 16 (falla si bajan las métricas)
#   4. fundamentos -> corre los 9 scripts de la parte 1 (solo biblioteca estándar)
#   5. terraform   -> fmt + validate de infra/ (sin tocar ningún proyecto real)
name: lab8 CI

on:
  push:
    branches: ["**"]
    paths: ["04-ia-generativa/lab08-curso-ia/**", ".github/workflows/lab8-ci.yml"]
  pull_request:
    paths: ["04-ia-generativa/lab08-curso-ia/**", ".github/workflows/lab8-ci.yml"]

defaults:
  run:
    working-directory: 04-ia-generativa/lab08-curso-ia

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      MODO: simulado
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: 04-ia-generativa/lab08-curso-ia/parte2_gcp/requirements.txt

      - name: Instalar dependencias
        run: pip install -r parte2_gcp/requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Fundamentos (parte 1)
        run: for f in parte1_fundamentos/*/*.py; do echo "== $f"; python "$f" > /dev/null; done

      - name: Tests (parte 2)
        working-directory: 04-ia-generativa/lab08-curso-ia/parte2_gcp
        run: pytest -v

      - name: Quality gate de evaluación (lab 16)
        working-directory: 04-ia-generativa/lab08-curso-ia/parte2_gcp
        run: python 16_evaluacion/evaluar.py

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-ia-generativa/lab08-curso-ia/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate
