# Jobs de GitLab CI para el micro lab 03-events-eventbridge-sqs. Plantillas en lab10_terraform_aws/.gitlab-ci.yml
# Variable requerida en GitLab: LAB03_TFVARS (tipo File) con el contenido de terraform.tfvars

.lab03_vars:
  variables:
    LAB_NAME: "03-events-eventbridge-sqs"
    LAB_DIR: "lab10_terraform_aws/microlabs/03-events-eventbridge-sqs"
    TFVARS_FILE: $LAB03_TFVARS

.lab03_changes: &lab03_changes
  - lab10_terraform_aws/microlabs/03-events-eventbridge-sqs/**/*
  - lab10_terraform_aws/modules/**/*
  - lab10_terraform_aws/.gitlab-ci.yml

lab03:validate:
  extends: [.tf_validate, .lab03_vars]
  rules:
    - changes: *lab03_changes

lab03:lint:
  extends: [.tf_lint, .lab03_vars]
  rules:
    - changes: *lab03_changes

lab03:checkov:
  extends: [.tf_checkov, .lab03_vars]
  rules:
    - changes: *lab03_changes

lab03:plan:
  extends: [.tf_plan, .lab03_vars]
  needs: ["lab03:validate"]
  rules:
    - changes: *lab03_changes

lab03:apply:
  extends: [.tf_apply, .lab03_vars]
  needs: ["lab03:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab03_changes
      when: manual

lab03:smoke:
  extends: [.tf_smoke, .lab03_vars]
  needs: ["lab03:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab03_changes

lab03:destroy:
  extends: [.tf_destroy, .lab03_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "03-events-eventbridge-sqs"
      when: manual
