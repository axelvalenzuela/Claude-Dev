# Jobs de GitLab CI para el micro lab 06-web3tier-alb-asg-rds. Plantillas en 03-cloud-e-infraestructura/lab10-terraform-aws/.gitlab-ci.yml
# Variable requerida en GitLab: LAB06_TFVARS (tipo File) con el contenido de terraform.tfvars

.lab06_vars:
  variables:
    LAB_NAME: "06-web3tier-alb-asg-rds"
    LAB_DIR: "03-cloud-e-infraestructura/lab10-terraform-aws/microlabs/06-web3tier-alb-asg-rds"
    TFVARS_FILE: $LAB06_TFVARS

.lab06_changes: &lab06_changes
  - 03-cloud-e-infraestructura/lab10-terraform-aws/microlabs/06-web3tier-alb-asg-rds/**/*
  - 03-cloud-e-infraestructura/lab10-terraform-aws/modules/**/*
  - 03-cloud-e-infraestructura/lab10-terraform-aws/.gitlab-ci.yml

lab06:validate:
  extends: [.tf_validate, .lab06_vars]
  rules:
    - changes: *lab06_changes

lab06:lint:
  extends: [.tf_lint, .lab06_vars]
  rules:
    - changes: *lab06_changes

lab06:checkov:
  extends: [.tf_checkov, .lab06_vars]
  rules:
    - changes: *lab06_changes

lab06:plan:
  extends: [.tf_plan, .lab06_vars]
  needs: ["lab06:validate"]
  rules:
    - changes: *lab06_changes

lab06:apply:
  extends: [.tf_apply, .lab06_vars]
  needs: ["lab06:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab06_changes
      when: manual

lab06:smoke:
  extends: [.tf_smoke, .lab06_vars]
  needs: ["lab06:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab06_changes

lab06:destroy:
  extends: [.tf_destroy, .lab06_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "06-web3tier-alb-asg-rds"
      when: manual
