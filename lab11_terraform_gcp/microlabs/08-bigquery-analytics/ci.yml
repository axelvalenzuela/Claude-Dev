# Jobs de GitLab CI para el micro lab 08-bigquery-analytics. Plantillas en lab11/.gitlab-ci.yml
# Variable requerida en GitLab: GCP08_TFVARS (tipo File) con el contenido de terraform.tfvars

.gcp08_vars:
  variables:
    LAB_NAME: "08-bigquery-analytics"
    LAB_DIR: "lab11/microlabs/08-bigquery-analytics"
    TFVARS_FILE: $GCP08_TFVARS

.gcp08_changes: &gcp08_changes
  - lab11/microlabs/08-bigquery-analytics/**/*
  - lab11/modules/**/*
  - lab11/.gitlab-ci.yml

gcp08:validate:
  extends: [.tf_validate, .gcp08_vars]
  rules:
    - changes: *gcp08_changes

gcp08:lint:
  extends: [.tf_lint, .gcp08_vars]
  rules:
    - changes: *gcp08_changes

gcp08:checkov:
  extends: [.tf_checkov, .gcp08_vars]
  rules:
    - changes: *gcp08_changes

gcp08:plan:
  extends: [.tf_plan, .gcp08_vars]
  needs: ["gcp08:validate"]
  rules:
    - changes: *gcp08_changes

gcp08:apply:
  extends: [.tf_apply, .gcp08_vars]
  needs: ["gcp08:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *gcp08_changes
      when: manual

gcp08:smoke:
  extends: [.tf_smoke, .gcp08_vars]
  needs: ["gcp08:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *gcp08_changes

gcp08:destroy:
  extends: [.tf_destroy, .gcp08_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "08-bigquery-analytics"
      when: manual
