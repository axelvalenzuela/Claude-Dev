# Jobs de GitLab CI para el micro lab 15-genai-model-armor-safety. Plantillas en lab11_terraform_gcp/.gitlab-ci.yml
# Variable requerida en GitLab: GCP15_TFVARS (tipo File) con el contenido de terraform.tfvars

.gcp15_vars:
  variables:
    LAB_NAME: "15-genai-model-armor-safety"
    LAB_DIR: "lab11_terraform_gcp/microlabs/15-genai-model-armor-safety"
    TFVARS_FILE: $GCP15_TFVARS

.gcp15_changes: &gcp15_changes
  - lab11_terraform_gcp/microlabs/15-genai-model-armor-safety/**/*
  - lab11_terraform_gcp/modules/**/*
  - lab11_terraform_gcp/.gitlab-ci.yml

gcp15:validate:
  extends: [.tf_validate, .gcp15_vars]
  rules:
    - changes: *gcp15_changes

gcp15:lint:
  extends: [.tf_lint, .gcp15_vars]
  rules:
    - changes: *gcp15_changes

gcp15:checkov:
  extends: [.tf_checkov, .gcp15_vars]
  rules:
    - changes: *gcp15_changes

gcp15:plan:
  extends: [.tf_plan, .gcp15_vars]
  needs: ["gcp15:validate"]
  rules:
    - changes: *gcp15_changes

gcp15:apply:
  extends: [.tf_apply, .gcp15_vars]
  needs: ["gcp15:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *gcp15_changes
      when: manual

gcp15:smoke:
  extends: [.tf_smoke, .gcp15_vars]
  needs: ["gcp15:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *gcp15_changes

gcp15:destroy:
  extends: [.tf_destroy, .gcp15_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "15-genai-model-armor-safety"
      when: manual
