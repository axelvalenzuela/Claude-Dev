# Jobs de GitLab CI para el micro lab 02-serverless-appsync-graphql. Plantillas en lab10_terraform_aws/.gitlab-ci.yml
# Variable requerida en GitLab: LAB02_TFVARS (tipo File) con el contenido de terraform.tfvars

.lab02_vars:
  variables:
    LAB_NAME: "02-serverless-appsync-graphql"
    LAB_DIR: "lab10_terraform_aws/microlabs/02-serverless-appsync-graphql"
    TFVARS_FILE: $LAB02_TFVARS

.lab02_changes: &lab02_changes
  - lab10_terraform_aws/microlabs/02-serverless-appsync-graphql/**/*
  - lab10_terraform_aws/modules/**/*
  - lab10_terraform_aws/.gitlab-ci.yml

lab02:validate:
  extends: [.tf_validate, .lab02_vars]
  rules:
    - changes: *lab02_changes

lab02:lint:
  extends: [.tf_lint, .lab02_vars]
  rules:
    - changes: *lab02_changes

lab02:checkov:
  extends: [.tf_checkov, .lab02_vars]
  rules:
    - changes: *lab02_changes

lab02:plan:
  extends: [.tf_plan, .lab02_vars]
  needs: ["lab02:validate"]
  rules:
    - changes: *lab02_changes

lab02:apply:
  extends: [.tf_apply, .lab02_vars]
  needs: ["lab02:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab02_changes
      when: manual

lab02:smoke:
  extends: [.tf_smoke, .lab02_vars]
  needs: ["lab02:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab02_changes

lab02:destroy:
  extends: [.tf_destroy, .lab02_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "02-serverless-appsync-graphql"
      when: manual
