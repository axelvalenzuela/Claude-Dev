# Jobs de GitLab CI para el micro lab 10-cloudformation-stacksets. Plantillas en lab10/.gitlab-ci.yml
# Variable requerida en GitLab: LAB10_TFVARS (tipo File) con el contenido de terraform.tfvars

.lab10_vars:
  variables:
    LAB_NAME: "10-cloudformation-stacksets"
    LAB_DIR: "lab10/microlabs/10-cloudformation-stacksets"
    TFVARS_FILE: $LAB10_TFVARS

.lab10_changes: &lab10_changes
  - lab10/microlabs/10-cloudformation-stacksets/**/*
  - lab10/modules/**/*
  - lab10/.gitlab-ci.yml

lab10:validate:
  extends: [.tf_validate, .lab10_vars]
  rules:
    - changes: *lab10_changes

lab10:lint:
  extends: [.tf_lint, .lab10_vars]
  rules:
    - changes: *lab10_changes

lab10:checkov:
  extends: [.tf_checkov, .lab10_vars]
  rules:
    - changes: *lab10_changes

lab10:plan:
  extends: [.tf_plan, .lab10_vars]
  needs: ["lab10:validate"]
  rules:
    - changes: *lab10_changes

lab10:apply:
  extends: [.tf_apply, .lab10_vars]
  needs: ["lab10:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab10_changes
      when: manual

lab10:smoke:
  extends: [.tf_smoke, .lab10_vars]
  needs: ["lab10:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab10_changes

lab10:destroy:
  extends: [.tf_destroy, .lab10_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "10-cloudformation-stacksets"
      when: manual
