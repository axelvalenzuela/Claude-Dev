{% if status == "draft" %}<span class="badge badge-draft">Borrador</span>
{% elif status == "submitted" %}<span class="badge badge-submitted">En revisión</span>
{% elif status == "approved" %}<span class="badge badge-approved">Aprobado</span>
{% elif status == "rejected" %}<span class="badge badge-rejected">Rechazado</span>
{% else %}<span class="badge bg-secondary">{{ status }}</span>
{% endif %}
