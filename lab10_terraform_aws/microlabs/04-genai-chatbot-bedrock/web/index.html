<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab10 · Chatbot Bedrock</title>
  <script src="config.js"></script>
  <style>
    :root { --bg:#f6f8fa; --card:#fff; --ink:#1f2933; --muted:#5b6770; --accent:#ff9900; --navy:#232f3e; --line:#d5dbe1; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    header { background:var(--navy); color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
    main { max-width:820px; margin:0 auto; padding:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
    #log { height:60vh; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:80%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; }
    .user { align-self:flex-end; background:var(--navy); color:#fff; }
    .bot { align-self:flex-start; background:#eef2f6; }
    .blocked { background:#fde8e8; }
    .meta { font-size:12px; color:var(--muted); margin-top:4px; }
    form { display:flex; gap:8px; margin-top:12px; }
    input { flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
    button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#111; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; }
    #login { display:grid; gap:8px; max-width:360px; margin:10vh auto; }
    .err { color:#c62828; font-size:13px; }
  </style>
</head>
<body>
<header><strong>Chatbot Bedrock · lab10</strong><span id="who"></span></header>
<main>
  <div id="login" class="card">
    <h3>Iniciar sesión (Cognito)</h3>
    <input id="user" type="email" placeholder="correo" autocomplete="username">
    <input id="pass" type="password" placeholder="contraseña" autocomplete="current-password">
    <button id="loginBtn">Entrar</button>
    <div id="loginErr" class="err"></div>
  </div>

  <div id="chat" class="card" hidden>
    <div id="log"></div>
    <form id="f">
      <input id="q" placeholder="Pregunta algo sobre AWS…" maxlength="4000" autocomplete="off">
      <button id="send">Enviar</button>
    </form>
  </div>
</main>

<script>
  // Login directo contra la API pública de Cognito (USER_PASSWORD_AUTH). Solo para laboratorio:
  // en producción usa Hosted UI / OAuth2 con PKCE.
  const cfg = window.CHAT_CONFIG;
  let idToken = null;
  const session = "web-" + Math.random().toString(36).slice(2, 8);

  async function login(username, password) {
    const r = await fetch(`https://cognito-idp.${cfg.region}.amazonaws.com/`, {
      method: "POST",
      headers: { "Content-Type": "application/x-amz-json-1.1", "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth" },
      body: JSON.stringify({ AuthFlow: "USER_PASSWORD_AUTH", ClientId: cfg.clientId, AuthParameters: { USERNAME: username, PASSWORD: password } }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.message || "Login fallido");
    return data.AuthenticationResult.IdToken;
  }

  function add(text, cls, meta) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; d.appendChild(m); }
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  loginBtn.onclick = async () => {
    loginErr.textContent = "";
    try {
      idToken = await login(user.value, pass.value);
      document.getElementById("login").hidden = true;
      chat.hidden = false;
      who.textContent = user.value;
      q.focus();
    } catch (e) { loginErr.textContent = e.message; }
  };

  f.onsubmit = async (e) => {
    e.preventDefault();
    const message = q.value.trim();
    if (!message) return;
    add(message, "user");
    q.value = ""; send.disabled = true;
    try {
      const r = await fetch(cfg.endpoint, {
        method: "POST",
        headers: { "Authorization": idToken, "Content-Type": "application/json" },
        body: JSON.stringify({ message, session }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.message || data.error || r.status);
      const blocked = data.stop_reason === "guardrail_intervened";
      const u = data.usage || {};
      add(data.answer, "bot" + (blocked ? " blocked" : ""),
          `${blocked ? "Bloqueado por guardrail · " : ""}tokens in ${u.inputTokens ?? "?"} / out ${u.outputTokens ?? "?"}`);
    } catch (err) {
      add("Error: " + err.message, "bot blocked");
    } finally { send.disabled = false; q.focus(); }
  };
</script>
</body>
</html>
