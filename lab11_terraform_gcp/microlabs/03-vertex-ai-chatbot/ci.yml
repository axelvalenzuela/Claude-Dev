# Jobs de GitLab CI para el micro lab 03-vertex-ai-chatbot. Plantillas en lab11/.gitlab-ci.yml
# Variable requerida en GitLab: GCP03_TFVARS (tipo File) con el contenido de terraform.tfvars

.gcp03_vars:
  variables:
    LAB_NAME: "03-vertex-ai-chatbot"
    LAB_DIR: "lab11/microlabs/03-vertex-ai-chatbot"
    TFVARS_FILE: $GCP03_TFVARS

.gcp03_changes: &gcp03_changes
  - lab11/microlabs/03-vertex-ai-chatbot/**/*
  - lab11/modules/**/*
  - lab11/.gitlab-ci.yml

gcp03:validate:
  extends: [.tf_validate, .gcp03_vars]
  rules:
    - changes: *gcp03_changes

gcp03:lint:
  extends: [.tf_lint, .gcp03_vars]
  rules:
    - changes: *gcp03_changes

gcp03:checkov:
  extends: [.tf_checkov, .gcp03_vars]
  rules:
    - changes: *gcp03_changes

gcp03:plan:
  extends: [.tf_plan, .gcp03_vars]
  needs: ["gcp03:validate"]
  rules:
    - changes: *gcp03_changes

gcp03:apply:
  extends: [.tf_apply, .gcp03_vars]
  needs: ["gcp03:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *gcp03_changes
      when: manual

gcp03:smoke:
  extends: [.tf_smoke, .gcp03_vars]
  needs: ["gcp03:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *gcp03_changes

gcp03:destroy:
  extends: [.tf_destroy, .gcp03_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "03-vertex-ai-chatbot"
      when: manual
