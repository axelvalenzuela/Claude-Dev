# CI template for lab2 (the Django travel-expense app). Runs on every push/PR
# that touches lab2/, so lab1 changes don't trigger it and vice versa.
#
# This is intentionally a starting point, not a finished pipeline — a real
# rollout would likely add here, in this order of priority:
#   1. A linter/formatter check (e.g. ruff) once the team picks one.
#   2. `pip-audit` or `safety` to flag known-vulnerable dependencies.
#   3. A push of the built image to a registry on tags/main, for the
#      intranet server to pull from (see docs/DEPLOYMENT.md).
name: lab2 CI

on:
  push:
    branches: ["**"]
    paths: ["lab2/**", ".github/workflows/lab2-ci.yml"]
  pull_request:
    paths: ["lab2/**", ".github/workflows/lab2-ci.yml"]

defaults:
  run:
    working-directory: lab2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: lab2/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-test-key

      - name: Run test suite
        run: python manage.py test
        env:
          DJANGO_SECRET_KEY: ci-test-key

      - name: Deployment-readiness check (production settings)
        run: python manage.py check --deploy
        env:
          DJANGO_SECRET_KEY: ci-test-key
          DJANGO_DEBUG: "False"
          DJANGO_HTTPS_ENABLED: "True"

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t lab2-app:ci .
