# Jobs de GitLab CI para el micro lab 07-sre-slo-cloudwatch-fis. Plantillas en 03-cloud-e-infraestructura/lab10-terraform-aws/.gitlab-ci.yml
# Variable requerida en GitLab: LAB07_TFVARS (tipo File) con el contenido de terraform.tfvars

.lab07_vars:
  variables:
    LAB_NAME: "07-sre-slo-cloudwatch-fis"
    LAB_DIR: "03-cloud-e-infraestructura/lab10-terraform-aws/microlabs/07-sre-slo-cloudwatch-fis"
    TFVARS_FILE: $LAB07_TFVARS

.lab07_changes: &lab07_changes
  - 03-cloud-e-infraestructura/lab10-terraform-aws/microlabs/07-sre-slo-cloudwatch-fis/**/*
  - 03-cloud-e-infraestructura/lab10-terraform-aws/modules/**/*
  - 03-cloud-e-infraestructura/lab10-terraform-aws/.gitlab-ci.yml

lab07:validate:
  extends: [.tf_validate, .lab07_vars]
  rules:
    - changes: *lab07_changes

lab07:lint:
  extends: [.tf_lint, .lab07_vars]
  rules:
    - changes: *lab07_changes

lab07:checkov:
  extends: [.tf_checkov, .lab07_vars]
  rules:
    - changes: *lab07_changes

lab07:plan:
  extends: [.tf_plan, .lab07_vars]
  needs: ["lab07:validate"]
  rules:
    - changes: *lab07_changes

lab07:apply:
  extends: [.tf_apply, .lab07_vars]
  needs: ["lab07:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab07_changes
      when: manual

lab07:smoke:
  extends: [.tf_smoke, .lab07_vars]
  needs: ["lab07:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab07_changes

lab07:destroy:
  extends: [.tf_destroy, .lab07_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "07-sre-slo-cloudwatch-fis"
      when: manual
