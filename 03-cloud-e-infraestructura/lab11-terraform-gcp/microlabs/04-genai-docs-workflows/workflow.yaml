# Pipeline de IA para documentos (Cloud Workflows). Lo dispara Eventarc con cada objeto nuevo en GCS.
# Configuración vía user_env_vars (MODEL, VERTEX_LOCATION, DATASET, TABLE, LANGUAGE): ver main.tf.
main:
  params: [event]
  steps:
    - init:
        assign:
          - bucket: ${event.data.bucket}
          - object: ${event.data.name}
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("VERTEX_LOCATION")}
          - model: ${sys.get_env("MODEL")}
          - parts: ${text.split(object, ".")}
          - ext: ${text.to_lower(parts[len(parts) - 1])}
          - content: ""
          - entities: []
          - summary: ""
          - ent_list: []

    # Solo procesa el prefijo incoming/ (el resto de objetos se ignora)
    - check_prefix:
        switch:
          - condition: ${not(text.match_regex(object, "^incoming/"))}
            return: '${"ignorado: " + object}'

    - process:
        try:
          steps:
            - route:
                switch:
                  - condition: ${ext == "txt"}
                    next: read_txt
                  - condition: ${ext == "png" or ext == "jpg" or ext == "jpeg"}
                    next: ocr
                next: unsupported

            - read_txt:
                call: http.get
                args:
                  url: ${"https://storage.googleapis.com/download/storage/v1/b/" + bucket + "/o/" + text.url_encode(object) + "?alt=media"}
                  auth:
                    type: OAuth2
                result: file
            # El body llega como bytes o como string según el Content-Type del objeto
            - set_txt:
                switch:
                  - condition: ${get_type(file.body) == "bytes"}
                    assign:
                      - content: ${text.decode(file.body)}
                    next: truncate
                next: set_txt_str
            - set_txt_str:
                assign:
                  - content: ${file.body}
                next: truncate

            - ocr:
                call: googleapis.vision.v1.images.annotate
                args:
                  body:
                    requests:
                      - image:
                          source:
                            gcsImageUri: ${"gs://" + bucket + "/" + object}
                        features:
                          - type: TEXT_DETECTION
                result: vision
            - set_ocr:
                assign:
                  - content: ${vision.responses[0].fullTextAnnotation.text}
                next: truncate

            - unsupported:
                raise: '${"Formato no soportado: " + ext}'

            - truncate:
                switch:
                  - condition: ${len(content) > 4500}
                    assign:
                      - content: ${text.substring(content, 0, 4500)}

            # Entidades y resumen en paralelo
            - analyze:
                parallel:
                  shared: [entities, summary]
                  branches:
                    - entities_branch:
                        steps:
                          - nl:
                              call: googleapis.language.v1.documents.analyzeEntities
                              args:
                                body:
                                  document:
                                    type: PLAIN_TEXT
                                    content: ${content}
                                    language: ${sys.get_env("LANGUAGE")}
                                  encodingType: UTF8
                              result: nl_result
                          - keep_entities:
                              assign:
                                - entities: ${nl_result.entities}
                    - summary_branch:
                        steps:
                          - gemini:
                              call: googleapis.aiplatform.v1.projects.locations.endpoints.generateContent
                              args:
                                model: ${"projects/" + project + "/locations/" + location + "/publishers/google/models/" + model}
                                region: ${location}
                                body:
                                  contents:
                                    - role: user
                                      parts:
                                        - text: ${"Resume en español en máximo 5 viñetas, sin inventar datos:\n\n" + content}
                                  generationConfig:
                                    maxOutputTokens: 400
                                    temperature: 0.2
                              result: gem
                          - keep_summary:
                              assign:
                                - summary: ${gem.candidates[0].content.parts[0].text}

            - compact_entities:
                for:
                  value: e
                  in: ${entities}
                  steps:
                    - add:
                        assign:
                          - ent_list: '${list.concat(ent_list, {"name": e.name, "type": e.type})}'

            - save:
                call: googleapis.bigquery.v2.tabledata.insertAll
                args:
                  projectId: ${project}
                  datasetId: ${sys.get_env("DATASET")}
                  tableId: ${sys.get_env("TABLE")}
                  body:
                    rows:
                      - insertId: ${object}
                        json:
                          document_id: ${object}
                          bucket: ${bucket}
                          summary: ${summary}
                          entities: ${json.encode_to_string(ent_list)}
                          processed_at: ${time.format(sys.now())}
                          execution: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
                result: insert
        except:
          as: e
          steps:
            - log_error:
                call: sys.log
                args:
                  severity: ERROR
                  json:
                    msg: pipeline de documentos fallido
                    object: ${object}
                    error: ${e}
            - reraise:
                raise: ${e}

    - done:
        return:
          document: ${object}
          entities: ${len(ent_list)}
