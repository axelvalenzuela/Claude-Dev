# Jobs de GitLab CI para el micro lab 02-pubsub-event-driven. Plantillas en lab11/.gitlab-ci.yml
# Variable requerida en GitLab: GCP02_TFVARS (tipo File) con el contenido de terraform.tfvars

.gcp02_vars:
  variables:
    LAB_NAME: "02-pubsub-event-driven"
    LAB_DIR: "lab11/microlabs/02-pubsub-event-driven"
    TFVARS_FILE: $GCP02_TFVARS

.gcp02_changes: &gcp02_changes
  - lab11/microlabs/02-pubsub-event-driven/**/*
  - lab11/modules/**/*
  - lab11/.gitlab-ci.yml

gcp02:validate:
  extends: [.tf_validate, .gcp02_vars]
  rules:
    - changes: *gcp02_changes

gcp02:lint:
  extends: [.tf_lint, .gcp02_vars]
  rules:
    - changes: *gcp02_changes

gcp02:checkov:
  extends: [.tf_checkov, .gcp02_vars]
  rules:
    - changes: *gcp02_changes

gcp02:plan:
  extends: [.tf_plan, .gcp02_vars]
  needs: ["gcp02:validate"]
  rules:
    - changes: *gcp02_changes

gcp02:apply:
  extends: [.tf_apply, .gcp02_vars]
  needs: ["gcp02:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *gcp02_changes
      when: manual

gcp02:smoke:
  extends: [.tf_smoke, .gcp02_vars]
  needs: ["gcp02:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *gcp02_changes

gcp02:destroy:
  extends: [.tf_destroy, .gcp02_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "02-pubsub-event-driven"
      when: manual
