# Jobs de GitLab CI para el micro lab 09-migration-mgn. Plantillas en lab10_terraform_aws/.gitlab-ci.yml
# Variable requerida en GitLab: LAB09_TFVARS (tipo File) con el contenido de terraform.tfvars

.lab09_vars:
  variables:
    LAB_NAME: "09-migration-mgn"
    LAB_DIR: "lab10_terraform_aws/microlabs/09-migration-mgn"
    TFVARS_FILE: $LAB09_TFVARS

.lab09_changes: &lab09_changes
  - lab10_terraform_aws/microlabs/09-migration-mgn/**/*
  - lab10_terraform_aws/modules/**/*
  - lab10_terraform_aws/.gitlab-ci.yml

lab09:validate:
  extends: [.tf_validate, .lab09_vars]
  rules:
    - changes: *lab09_changes

lab09:lint:
  extends: [.tf_lint, .lab09_vars]
  rules:
    - changes: *lab09_changes

lab09:checkov:
  extends: [.tf_checkov, .lab09_vars]
  rules:
    - changes: *lab09_changes

lab09:plan:
  extends: [.tf_plan, .lab09_vars]
  needs: ["lab09:validate"]
  rules:
    - changes: *lab09_changes

lab09:apply:
  extends: [.tf_apply, .lab09_vars]
  needs: ["lab09:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab09_changes
      when: manual

lab09:smoke:
  extends: [.tf_smoke, .lab09_vars]
  needs: ["lab09:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab09_changes

lab09:destroy:
  extends: [.tf_destroy, .lab09_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "09-migration-mgn"
      when: manual
