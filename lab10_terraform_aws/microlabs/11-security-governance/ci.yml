# Jobs de GitLab CI para el micro lab 11-security-governance. Plantillas en lab10/.gitlab-ci.yml
# Variable requerida en GitLab: LAB11_TFVARS (tipo File) con el contenido de terraform.tfvars

.lab11_vars:
  variables:
    LAB_NAME: "11-security-governance"
    LAB_DIR: "lab10/microlabs/11-security-governance"
    TFVARS_FILE: $LAB11_TFVARS

.lab11_changes: &lab11_changes
  - lab10/microlabs/11-security-governance/**/*
  - lab10/modules/**/*
  - lab10/.gitlab-ci.yml

lab11:validate:
  extends: [.tf_validate, .lab11_vars]
  rules:
    - changes: *lab11_changes

lab11:lint:
  extends: [.tf_lint, .lab11_vars]
  rules:
    - changes: *lab11_changes

lab11:checkov:
  extends: [.tf_checkov, .lab11_vars]
  rules:
    - changes: *lab11_changes

lab11:plan:
  extends: [.tf_plan, .lab11_vars]
  needs: ["lab11:validate"]
  rules:
    - changes: *lab11_changes

lab11:apply:
  extends: [.tf_apply, .lab11_vars]
  needs: ["lab11:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab11_changes
      when: manual

lab11:smoke:
  extends: [.tf_smoke, .lab11_vars]
  needs: ["lab11:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab11_changes

lab11:destroy:
  extends: [.tf_destroy, .lab11_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "11-security-governance"
      when: manual
