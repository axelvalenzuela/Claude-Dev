# Jobs de GitLab CI para el micro lab 11-security-guardrails-rbac. Plantillas en 03-cloud-e-infraestructura/lab10-terraform-aws/.gitlab-ci.yml
# Variable requerida en GitLab: LAB11_TFVARS (tipo File) con el contenido de terraform.tfvars

.lab11_vars:
  variables:
    LAB_NAME: "11-security-guardrails-rbac"
    LAB_DIR: "03-cloud-e-infraestructura/lab10-terraform-aws/microlabs/11-security-guardrails-rbac"
    TFVARS_FILE: $LAB11_TFVARS

.lab11_changes: &lab11_changes
  - 03-cloud-e-infraestructura/lab10-terraform-aws/microlabs/11-security-guardrails-rbac/**/*
  - 03-cloud-e-infraestructura/lab10-terraform-aws/modules/**/*
  - 03-cloud-e-infraestructura/lab10-terraform-aws/.gitlab-ci.yml

03-cloud-e-infraestructura/lab11-terraform-gcp:validate:
  extends: [.tf_validate, .lab11_vars]
  rules:
    - changes: *lab11_changes

03-cloud-e-infraestructura/lab11-terraform-gcp:lint:
  extends: [.tf_lint, .lab11_vars]
  rules:
    - changes: *lab11_changes

03-cloud-e-infraestructura/lab11-terraform-gcp:checkov:
  extends: [.tf_checkov, .lab11_vars]
  rules:
    - changes: *lab11_changes

03-cloud-e-infraestructura/lab11-terraform-gcp:plan:
  extends: [.tf_plan, .lab11_vars]
  needs: ["03-cloud-e-infraestructura/lab11-terraform-gcp:validate"]
  rules:
    - changes: *lab11_changes

03-cloud-e-infraestructura/lab11-terraform-gcp:apply:
  extends: [.tf_apply, .lab11_vars]
  needs: ["03-cloud-e-infraestructura/lab11-terraform-gcp:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab11_changes
      when: manual

03-cloud-e-infraestructura/lab11-terraform-gcp:smoke:
  extends: [.tf_smoke, .lab11_vars]
  needs: ["03-cloud-e-infraestructura/lab11-terraform-gcp:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lab11_changes

03-cloud-e-infraestructura/lab11-terraform-gcp:destroy:
  extends: [.tf_destroy, .lab11_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "11-security-guardrails-rbac"
      when: manual
