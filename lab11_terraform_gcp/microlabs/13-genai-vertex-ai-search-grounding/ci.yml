# Jobs de GitLab CI para el micro lab 13-genai-vertex-ai-search-grounding. Plantillas en lab11_terraform_gcp/.gitlab-ci.yml
# Variable requerida en GitLab: GCP13_TFVARS (tipo File) con el contenido de terraform.tfvars

.gcp13_vars:
  variables:
    LAB_NAME: "13-genai-vertex-ai-search-grounding"
    LAB_DIR: "lab11_terraform_gcp/microlabs/13-genai-vertex-ai-search-grounding"
    TFVARS_FILE: $GCP13_TFVARS

.gcp13_changes: &gcp13_changes
  - lab11_terraform_gcp/microlabs/13-genai-vertex-ai-search-grounding/**/*
  - lab11_terraform_gcp/modules/**/*
  - lab11_terraform_gcp/.gitlab-ci.yml

gcp13:validate:
  extends: [.tf_validate, .gcp13_vars]
  rules:
    - changes: *gcp13_changes

gcp13:lint:
  extends: [.tf_lint, .gcp13_vars]
  rules:
    - changes: *gcp13_changes

gcp13:checkov:
  extends: [.tf_checkov, .gcp13_vars]
  rules:
    - changes: *gcp13_changes

gcp13:plan:
  extends: [.tf_plan, .gcp13_vars]
  needs: ["gcp13:validate"]
  rules:
    - changes: *gcp13_changes

gcp13:apply:
  extends: [.tf_apply, .gcp13_vars]
  needs: ["gcp13:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *gcp13_changes
      when: manual

gcp13:smoke:
  extends: [.tf_smoke, .gcp13_vars]
  needs: ["gcp13:apply"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *gcp13_changes

gcp13:destroy:
  extends: [.tf_destroy, .gcp13_vars]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DESTROY_LAB == "13-genai-vertex-ai-search-grounding"
      when: manual
