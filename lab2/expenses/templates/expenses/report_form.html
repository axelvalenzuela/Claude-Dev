{% extends "base.html" %}
{% block title %}New report{% endblock %}
{% block content %}
<h2>New expense report</h2>
<div class="row">
    <div class="col-md-6">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">{{ form.title.label }}</label>
                {{ form.title }}
                {% if form.title.errors %}<div class="text-danger small">{{ form.title.errors|striptags }}</div>{% endif %}
            </div>
            <div class="mb-3">
                <label class="form-label">{{ form.description.label }}</label>
                {{ form.description }}
            </div>
            <button type="submit" class="btn btn-primary">Create</button>
            <a href="{% url 'reports:list' %}" class="btn btn-link">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
